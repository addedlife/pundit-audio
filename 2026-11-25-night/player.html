<style>

@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#21201e;--ink:#f2efe9;--mut:#a7a29b;--line:#35332f;--acc:#4ba3e3}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Georgia,serif}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 34px}

<script>
const TRACKS = [{"num": 1, "id": "intro", "section": "SBR News", "title": "This ... is SBR News (Night Brief)", "file": "01-intro.mp3", "duration": 5.54, "clock_intro": "after", "src": "01-intro.mp3"}, {"num": 2, "id": "story-01", "section": "Top Stories", "title": "Storm postpones Macy’s 100th parade for the first time", "file": "02-story-01.mp3", "duration": 67.92, "src": "02-story-01.mp3"}, {"num": 3, "id": "story-02", "section": "Top Stories", "title": "Third-quarter growth revised up to 4.3%", "file": "03-story-02.mp3", "duration": 52.53, "src": "03-story-02.mp3"}, {"num": 4, "id": "story-03", "section": "Top Stories", "title": "Projectile explodes near tanker off Dubai", "file": "04-story-03.mp3", "duration": 47.07, "src": "04-story-03.mp3"}, {"num": 5, "id": "story-04", "section": "Israel", "title": "Liberman’s party slated for defense, justice in Eisenkot deal", "file": "05-story-04.mp3", "duration": 55.8, "src": "05-story-04.mp3"}, {"num": 6, "id": "story-05", "section": "Israel", "title": "Knesset advances repeal of Karhi broadcasting law", "file": "06-story-05.mp3", "duration": 44.09, "src": "06-story-05.mp3"}, {"num": 7, "id": "story-06", "section": "Chareidi World", "title": "Liberman: UTJ has rabbanim’s green light; Likud’s Chikli attacks draft deal", "file": "07-story-06.mp3", "duration": 54.36, "src": "07-story-06.mp3"}, {"num": 8, "id": "story-07", "section": "Tech", "title": "New York bans AI chatbot toys for five years", "file": "08-story-07.mp3", "duration": 21.47, "src": "08-story-07.mp3"}, {"num": 9, "id": "story-08", "section": "Other Notable", "title": "Army blows up its lead azide stockpile in Iowa", "file": "09-story-08.mp3", "duration": 45.45, "src": "09-story-08.mp3"}, {"num": 10, "id": "story-09", "section": "Other Notable", "title": "Colombian forces free 76 hostages in Cartagena supermarket", "file": "10-story-09.mp3", "duration": 43.39, "src": "10-story-09.mp3"}, {"num": 11, "id": "weather", "section": "Weather", "title": "South Bend, IN Forecast & 5-Day Outlook", "file": "11-weather.mp3", "duration": 68.26, "src": "11-weather.mp3"}, {"num": 12, "id": "signoff", "section": "SBR News", "title": "That's the latest from SBR News", "file": "12-signoff.mp3", "duration": 2.25, "src": "12-signoff.mp3"}];
const CLOCK_ABS = "https://addedlife.github.io/pundit-audio/clock/";
const CLOCK_BASE = false ? CLOCK_ABS : (location.protocol === 'file:' ? CLOCK_ABS : '../clock/');
const TIME_CHECK_EVERY = 3;
const SILENT_WAV = 'data:audio/wav;base64,UklGRmQBAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==';

const au = document.getElementById('au');
const playBtn = document.getElementById('play');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const seek = document.getElementById('seek');
const curEl = document.getElementById('cur');
const durEl = document.getElementById('dur');
const nsec = document.getElementById('nsec');
const ntit = document.getElementById('ntit');
const listEl = document.getElementById('list');
const spdEl = document.getElementById('spd');

let idx = 0, rate = 1.0, playing = false;
let phase = 'track'; // 'track' | 'intro-clock' | 'timecheck' | 'outro-clock'
let pendingNextIdx = 0;
let loadSeq = 0;
let activeBlobUrl = null;
let prewarmedIntro = null;
let prewarmPromise = null;
let prewarmedNextClock = null;
let prewarmNextClockPromise = null;
let userInteracted = false;
const preloadedTracks = new Map();
const preloadingTracks = new Set();

const q = new URLSearchParams(location.search);
const qt = parseInt(q.get('track') || q.get('story') || '0', 10);
if (qt >= 1 && qt <= TRACKS.length) idx = qt - 1;
const hasTrack = q.has('track') || q.has('story');
const apRaw = (q.get('autoplay') || '').toLowerCase();
const wantAuto = apRaw === '1' || apRaw === 'true' || (q.has('autoplay') && apRaw === '') || (!hasTrack && apRaw !== '0' && apRaw !== 'false');
let liveClock = !hasTrack || qt === 1;

const AC = window.AudioContext || window.webkitAudioContext;
let actx = null;
const clipCache = new Map();

function getActx(){
  if (!actx && AC) actx = new AC();
  return actx;
}

function minuteWords(m){
  const ones = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tens = ['','','twenty','thirty','forty','fifty'];
  if (m === 0) return "o'clock";
  if (m < 10) return 'oh ' + ones[m];
  if (m < 20) return ones[m];
  const t = Math.floor(m / 10), o = m % 10;
  return tens[t] + (o ? '-' + ones[o] : '');
}
function periodInfo(h24, m){
  if (h24 === 0 && m === 0) return { key: 'midnight', spoken: 'midnight' };
  if (h24 === 12 && m === 0) return { key: 'noon', spoken: 'noon' };
  if (h24 < 12) return { key: 'morning', spoken: 'in the morning' };
  if (h24 < 18) return { key: 'afternoon', spoken: 'in the afternoon' };
  if (h24 < 21) return { key: 'evening', spoken: 'in the evening' };
  return { key: 'night', spoken: 'at night' };
}
function timeKeys(d){
  const h24 = d.getHours();
  const m = d.getMinutes();
  const h12 = (h24 % 12) || 12;
  const ampm = h24 < 12 ? 'am' : 'pm';
  const hKey = 'h-' + String(h12).padStart(2, '0');
  const mKey = 'm-' + String(m).padStart(2, '0');
  const pr = periodInfo(h24, m);
  const hourW = ({1:'one',2:'two',3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',9:'nine',10:'ten',11:'eleven',12:'twelve'})[h12];
  const minW = minuteWords(m);
  const spokenCore = (pr.key === 'noon' || pr.key === 'midnight') ? ("twelve o'clock " + pr.spoken) : (hourW + ' ' + minW + ' ' + pr.spoken);
  const spoken = "It's " + spokenCore;
  const label = spokenCore;
  return { key: hKey + '_' + mKey + '_' + pr.key, hKey, mKey, ampm, periodKey: pr.key, spoken, label, nextMKey: 'm-' + String((m + 1) % 60).padStart(2, '0') };
}

async function fetchClipBuffer(name){
  if (clipCache.has(name)) return clipCache.get(name);
  const p = (async () => {
    const ctx = getActx();
    if (!ctx) throw new Error('no AudioContext');
    let resp;
    try {
      resp = await fetch(CLOCK_BASE + name + '.mp3', { cache: 'force-cache' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
    } catch (e) {
      if (CLOCK_ABS && CLOCK_BASE !== CLOCK_ABS) {
        resp = await fetch(CLOCK_ABS + name + '.mp3', { cache: 'force-cache' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
      } else {
        throw e;
      }
    }
    const ab = await resp.arrayBuffer();
    return await new Promise((res, rej) => {
      const pr = ctx.decodeAudioData(ab, res, rej);
      if (pr && pr.then) pr.then(res, rej);
    });
  })();
  p.catch(() => clipCache.delete(name));
  clipCache.set(name, p);
  return p;
}

function trimPcm(f32, sr, thr = 0.004){
  let s = 0, e = f32.length;
  while (s < e && Math.abs(f32[s]) < thr) s++;
  while (e > s && Math.abs(f32[e - 1]) < thr) e--;
  const pad = Math.floor(sr * 0.004);
  s = Math.max(0, s - pad);
  e = Math.min(f32.length, e + pad);
  return f32.subarray(s, e);
}

function encodeWav(parts, gapsSec, sr){
  let totalSamples = 0;
  const gapSamples = gapsSec.map(g => Math.max(0, Math.round(g * sr)));
  for (let i = 0; i < parts.length; i++) {
    totalSamples += parts[i].length;
    if (i < gapSamples.length) totalSamples += gapSamples[i];
  }
  const dataBytes = totalSamples * 2;
  const buf = new ArrayBuffer(44 + dataBytes);
  const v = new DataView(buf);
  const ws = (off, s) => { for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); };
  ws(0, 'RIFF');
  v.setUint32(4, 36 + dataBytes, true);
  ws(8, 'WAVE');
  ws(12, 'fmt ');
  v.setUint32(16, 16, true);
  v.setUint16(20, 1, true);
  v.setUint16(22, 1, true);
  v.setUint32(24, sr, true);
  v.setUint32(28, sr * 2, true);
  v.setUint16(32, 2, true);
  v.setUint16(34, 16, true);
  ws(36, 'data');
  v.setUint32(40, dataBytes, true);
  let off = 44;
  for (let i = 0; i < parts.length; i++) {
    const ch = parts[i];
    const fadeLen = Math.min(Math.floor(sr * 0.004), Math.floor(ch.length / 4));
    for (let j = 0; j < ch.length; j++) {
      let x = ch[j];
      if (fadeLen > 0) {
        if (j < fadeLen) x *= j / fadeLen;
        else if (j >= ch.length - fadeLen) x *= (ch.length - 1 - j) / fadeLen;
      }
      if (x > 1) x = 1; else if (x < -1) x = -1;
      v.setInt16(off, x < 0 ? x * 0x8000 : x * 0x7fff, true);
      off += 2;
    }
    if (i < gapSamples.length) off += gapSamples[i] * 2;
  }
  return { blob: new Blob([buf], { type: 'audio/wav' }), duration: totalSamples / sr };
}

async function buildClockBlob(kind, d){
  const tk = timeKeys(d || new Date());
  let seq, gaps;
  if (kind === 'intro') {
    seq = ['sbr-intro', 'its', tk.hKey, tk.mKey, tk.periodKey];
    gaps = [0.38, 0.035, 0.025, 0.045];
  } else if (kind === 'outro') {
    seq = ['its', tk.hKey, tk.mKey, tk.periodKey, 'sbr-intro'];
    gaps = [0.035, 0.025, 0.045, 1.00];
  } else {
    seq = ['its', tk.hKey, tk.mKey, tk.periodKey];
    gaps = [0.035, 0.025, 0.045, 1.00];
  }
  const bufs = await Promise.all(seq.map(fetchClipBuffer));
  const sr = bufs[0].sampleRate;
  const parts = bufs.map(b => trimPcm(b.getChannelData(0), sr));
  const wav = encodeWav(parts, gaps, sr);
  return { url: URL.createObjectURL(wav.blob), label: tk.label, spoken: tk.spoken, key: kind + '_' + tk.key, duration: wav.duration };
}

function prewarmMinute(){
  if (!liveClock || !AC) return;
  const tk = timeKeys(new Date());
  ['sbr-intro', 'its', 'morning', 'afternoon', 'evening', 'night', 'noon', 'midnight', tk.hKey, tk.mKey, tk.nextMKey, tk.periodKey].forEach(k => {
    fetchClipBuffer(k).catch(() => {});
  });
}

function resolvedTrackSrc(t){
  return (t && preloadedTracks.get(t.src)) || (t ? t.src : '');
}

function preloadTrack(i){
  if (i < 0 || i >= TRACKS.length) return;
  const t = TRACKS[i];
  if (!t || !t.src || t.src.startsWith('data:') || preloadedTracks.has(t.src) || preloadingTracks.has(t.src)) return;
  preloadingTracks.add(t.src);
  fetch(t.src, { cache: 'force-cache' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
    .then(b => {
      preloadedTracks.set(t.src, URL.createObjectURL(b));
      // Evict tracks well behind current index to keep memory small
      for (let j = 0; j < idx - 2; j++) {
        const old = TRACKS[j];
        if (old && preloadedTracks.has(old.src)) {
          URL.revokeObjectURL(preloadedTracks.get(old.src));
          preloadedTracks.delete(old.src);
        }
      }
    })
    .catch(() => {})
    .finally(() => preloadingTracks.delete(t.src));
}

function nextClockKindAfter(i){
  if (!liveClock || !AC || i + 1 >= TRACKS.length) return null;
  const curT = TRACKS[i], nextT = TRACKS[i + 1];
  if (nextT.id === 'signoff') return 'outro';
  if (curT.id && curT.id.startsWith('story-') && nextT.id && nextT.id.startsWith('story-')) {
    const m = curT.id.match(/^story-(\d+)$/);
    const sNum = m ? parseInt(m[1], 10) : 0;
    if (sNum > 0 && sNum % TIME_CHECK_EVERY === 0) return 'check';
  }
  return null;
}

function prewarmNextClock(){
  const kind = nextClockKindAfter(idx);
  if (!kind) return;
  const tk = timeKeys(new Date());
  const expectedKey = kind + '_' + tk.key;
  if (prewarmedNextClock && prewarmedNextClock.key === expectedKey) return;
  if (prewarmNextClockPromise) return;
  prewarmMinute();
  prewarmNextClockPromise = buildClockBlob(kind, new Date()).then(res => {
    if (prewarmedNextClock && prewarmedNextClock.url !== activeBlobUrl) URL.revokeObjectURL(prewarmedNextClock.url);
    prewarmedNextClock = res;
    prewarmNextClockPromise = null;
    return res;
  }).catch(() => {
    prewarmNextClockPromise = null;
    return null;
  });
}

function prewarmIntro(){
  preloadTrack(idx);
  if (!liveClock || !AC) return Promise.resolve(null);
  const tk = timeKeys(new Date());
  if (prewarmedIntro && prewarmedIntro.key === 'intro_' + tk.key) return Promise.resolve(prewarmedIntro);
  if (prewarmPromise) return prewarmPromise;
  prewarmMinute();
  prewarmPromise = buildClockBlob('intro', new Date()).then(res => {
    if (prewarmedIntro && prewarmedIntro.url !== activeBlobUrl) URL.revokeObjectURL(prewarmedIntro.url);
    prewarmedIntro = res;
    prewarmPromise = null;
    return res;
  }).catch(() => {
    prewarmPromise = null;
    return null;
  });
  return prewarmPromise;
}

function setBlobSrc(url){
  if (activeBlobUrl && activeBlobUrl !== url && (!prewarmedIntro || activeBlobUrl !== prewarmedIntro.url)) {
    URL.revokeObjectURL(activeBlobUrl);
  }
  activeBlobUrl = url;
  au.src = url;
}

function setClockActive(res, pName){
  phase = pName;
  setBlobSrc(res.url);
  au.playbackRate = rate;
  if (pName === 'intro-clock') {
    nsec.textContent = `Track ${TRACKS[idx].num} of ${TRACKS.length} · SBR News`;
    ntit.textContent = `This ... is SBR News · ${res.spoken || ("It's " + res.label)}`;
  } else if (pName === 'timecheck') {
    nsec.textContent = `Time Check · SBR News`;
    ntit.textContent = res.spoken || (`It's ${res.label}`);
  } else if (pName === 'outro-clock') {
    nsec.textContent = `Track ${TRACKS[idx].num} of ${TRACKS.length} · SBR News`;
    ntit.textContent = `${res.spoken || ("It's " + res.label)} · This ... is SBR News`;
  }
  durEl.textContent = fmt(res.duration);
  curEl.textContent = '0:00';
  seek.value = 0;
  updateMediaSession(ntit.textContent);
}

function tryPlay(){
  const p = au.play();
  if (p && p.catch) p.catch(() => {});
}

function startFromGesture(){
  userInteracted = true;
  if (phase === 'sleep') { au.play().catch(() => {}); return; }
  if (phase === 'sleep-done') { if (sleepOn && sleepMan) startSleep(false); return; }
  if (phase === 'intro-clock' || phase === 'outro-clock' || phase === 'timecheck') {
    const kind = phase === 'intro-clock' ? 'intro' : (phase === 'outro-clock' ? 'outro' : 'check');
    const tk = timeKeys(new Date());
    if (kind === 'intro' && prewarmedIntro && prewarmedIntro.key === 'intro_' + tk.key) {
      setClockActive(prewarmedIntro, 'intro-clock');
      const p = au.play();
      if (p && p.catch) p.catch(() => {});
      return;
    }
    au.src = SILENT_WAV;
    const prime = au.play();
    if (prime && prime.catch) prime.catch(() => {});
    const mySeq = loadSeq;
    const targetPhase = phase;
    buildClockBlob(kind, new Date()).then(res => {
      if (mySeq !== loadSeq) return;
      setClockActive(res, targetPhase);
      au.play().catch(() => {});
    }).catch(() => {
      if (mySeq !== loadSeq) return;
      phase = 'track';
      au.src = resolvedTrackSrc(TRACKS[idx]);
      au.playbackRate = rate;
      au.play().catch(() => {});
    });
    return;
  }
  const p = au.play();
  if (p && p.catch) p.catch(() => {});
}

function fmt(s){ if(!isFinite(s)||s<0)return '0:00'; s=Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

function updateMediaSession(titleOverride){
  if (!('mediaSession' in navigator)) return;
  if (phase === 'sleep' || phase === 'sleep-done') return;
  const t = TRACKS[idx];
  navigator.mediaSession.metadata = new MediaMetadata({
    title: titleOverride || t.title,
    artist: 'SBR News',
    album: 'Wednesday, November 25, 2026 · Night Brief',
  });
  navigator.mediaSession.setActionHandler('play', () => startFromGesture());
  navigator.mediaSession.setActionHandler('pause', () => au.pause());
  navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.click());
  navigator.mediaSession.setActionHandler('nexttrack', () => nextBtn.click());
  try {
    navigator.mediaSession.setActionHandler('seekto', (d) => { if (d.seekTime != null) au.currentTime = d.seekTime; });
  } catch {}
}

function renderList(){
  listEl.innerHTML = '';
  TRACKS.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'row' + (i === idx ? ' on' : '');
    b.innerHTML = `<span class="num">${t.num}</span><span class="meta"><div class="rsec">${t.section}</div><div class="rtit">${t.title}</div></span><span class="rdur">${fmt(t.duration)}</span>`;
    b.onclick = () => {
      userInteracted = true;
      if (t.id === 'intro') liveClock = true;
      load(i, true);
    };
    listEl.appendChild(b);
  });
  renderSleepUI();
}

function playClockPhase(kind, pName, autoPlay, fallbackTrackIdx){
  const mySeq = loadSeq;
  phase = pName;
  if (kind === 'intro') {
    nsec.textContent = `Track ${TRACKS[idx].num} of ${TRACKS.length} · SBR News`;
    ntit.textContent = TRACKS[idx].title;
  } else if (kind === 'check') {
    nsec.textContent = `Time Check · SBR News`;
    ntit.textContent = timeKeys(new Date()).spoken;
  } else {
    nsec.textContent = `Track ${TRACKS[idx].num} of ${TRACKS.length} · SBR News`;
    ntit.textContent = `${timeKeys(new Date()).spoken} · This ... is SBR News`;
  }
  renderList();
  updateMediaSession(ntit.textContent);

  const tk = timeKeys(new Date());
  if (kind === 'intro' && prewarmedIntro && prewarmedIntro.key === 'intro_' + tk.key) {
    setClockActive(prewarmedIntro, pName);
    preloadTrack(idx);
    if (autoPlay) tryPlay();
    return;
  }
  if (kind !== 'intro' && prewarmedNextClock && prewarmedNextClock.key === kind + '_' + tk.key) {
    setClockActive(prewarmedNextClock, pName);
    if (kind === 'check') preloadTrack(fallbackTrackIdx);
    if (autoPlay) tryPlay();
    return;
  }
  if (kind === 'intro' && autoPlay && !userInteracted) {
    const builder = kind === 'intro' ? prewarmIntro() : buildClockBlob(kind, new Date());
    builder.then(res => {
      if (mySeq !== loadSeq) return;
      if (res) {
        setClockActive(res, pName);
        if (!userInteracted) tryPlay();
      } else {
        phase = 'track';
        au.src = TRACKS[fallbackTrackIdx].src;
        au.playbackRate = rate;
        if (!userInteracted) tryPlay();
      }
    }).catch(() => {
      if (mySeq !== loadSeq) return;
      phase = 'track';
      au.src = resolvedTrackSrc(TRACKS[fallbackTrackIdx]);
      au.playbackRate = rate;
      if (!userInteracted) tryPlay();
    });
    return;
  }
  (kind === 'intro' ? prewarmIntro() : buildClockBlob(kind, new Date())).then(res => {
    if (mySeq !== loadSeq) return;
    if (res) {
      setClockActive(res, pName);
      if (autoPlay) tryPlay();
    } else {
      phase = 'track';
      au.src = resolvedTrackSrc(TRACKS[fallbackTrackIdx]);
      au.playbackRate = rate;
      if (autoPlay) tryPlay();
    }
  }).catch(() => {
    if (mySeq !== loadSeq) return;
    phase = 'track';
    au.src = resolvedTrackSrc(TRACKS[fallbackTrackIdx]);
    au.playbackRate = rate;
    if (autoPlay) tryPlay();
  });
}

function load(i, autoPlay){
  if (i < 0) i = 0;
  if (i >= TRACKS.length){ newsEnded(); return; }
  idx = i;
  newsFinished = false;
  loadSeq++;
  const t = TRACKS[idx];
  if (liveClock && t.id === 'intro' && AC) {
    playClockPhase('intro', 'intro-clock', autoPlay, idx);
    return;
  }
  if (liveClock && t.id === 'signoff' && AC) {
    playClockPhase('outro', 'outro-clock', autoPlay, idx);
    return;
  }
  phase = 'track';
  nsec.textContent = `Track ${t.num} of ${TRACKS.length} · ${t.section}`;
  ntit.textContent = t.title;
  au.src = resolvedTrackSrc(t);
  au.playbackRate = rate;
  durEl.textContent = fmt(t.duration);
  curEl.textContent = '0:00';
  seek.value = 0;
  renderList();
  updateMediaSession();
  preloadTrack(idx + 1);
  if (autoPlay) tryPlay();
}

playBtn.onclick = () => {
  if (phase === 'sleep-done') { userInteracted = true; if (sleepOn && sleepMan) startSleep(false); return; }
  if (phase === 'sleep') { userInteracted = true; if (au.paused) au.play().catch(() => {}); else au.pause(); return; }
  if (au.paused) {
    if (!au.getAttribute('src') || (phase !== 'track' && au.currentTime === 0)) {
      startFromGesture();
    } else {
      userInteracted = true;
      au.play().catch(() => {});
    }
  } else {
    au.pause();
  }
};
prevBtn.onclick = () => {
  userInteracted = true;
  if (inSleep()) { sleepPrev(); return; }
  if (phase === 'timecheck') { load(idx, true); return; }
  if (au.currentTime > 4) { au.currentTime = 0; } else { load(idx - 1, true); }
};
nextBtn.onclick = () => {
  userInteracted = true;
  if (inSleep()) { sleepNext(); return; }
  if (phase === 'timecheck') { load(pendingNextIdx, true); return; }
  load(idx + 1, true);
};
au.onplay = () => { playing = true; playBtn.innerHTML = '&#10074;&#10074; Pause'; if('mediaSession' in navigator) navigator.mediaSession.playbackState='playing'; };
au.onpause = () => { playing = false; playBtn.innerHTML = '&#9654; Play'; if('mediaSession' in navigator) navigator.mediaSession.playbackState='paused'; };
au.onended = () => {
  if (phase === 'intro-clock') {
    if (TRACKS[idx].clock_intro === 'after') {
      phase = 'track';
      au.src = resolvedTrackSrc(TRACKS[idx]);
      au.playbackRate = rate;
      preloadTrack(idx + 1);
      tryPlay();
    } else {
      load(idx + 1, true);
    }
    return;
  }
  if (phase === 'timecheck') {
    load(pendingNextIdx, true);
    return;
  }
  if (phase === 'sleep') {
    if (sleepPart === 'intro') { playSleepAt(sleepPos, 'piece'); }
    else if (sleepPart === 'piece' && sleepPos >= 0 && hostOn && sleepTracks()[sleepOrder[sleepPos]].outro) { playSleepAt(sleepPos, 'outro'); }
    else { sleepNext(); }
    return;
  }
  if (phase === 'outro-clock') {
    newsEnded();
    return;
  }
  if (idx + 1 < TRACKS.length) {
    const curT = TRACKS[idx], nextT = TRACKS[idx + 1];
    if (liveClock && AC && curT.id && curT.id.startsWith('story-') && nextT.id && nextT.id.startsWith('story-')) {
      const m = curT.id.match(/^story-(\d+)$/);
      const sNum = m ? parseInt(m[1], 10) : 0;
      if (sNum > 0 && sNum % TIME_CHECK_EVERY === 0) {
        pendingNextIdx = idx + 1;
        loadSeq++;
        playClockPhase('check', 'timecheck', true, idx + 1);
        return;
      }
    }
    load(idx + 1, true);
  } else {
    newsEnded();
  }
};
au.ontimeupdate = () => {
  if (!au.duration) return;
  seek.max = au.duration;
  seek.value = au.currentTime;
  curEl.textContent = fmt(au.currentTime);
  durEl.textContent = fmt(au.duration);
  if (phase === 'sleep') return;
  if (au.duration - au.currentTime < 25) preloadTrack(idx + 1);
  if (liveClock && au.duration - au.currentTime < 15) prewarmNextClock();
};
seek.oninput = () => { au.currentTime = Number(seek.value); };

[0.9, 1.0, 1.15, 1.25].forEach(r => {
  const b = document.createElement('button');
  b.textContent = r + 'x';
  if (r === rate) b.className = 'on';
  b.onclick = () => {
    rate = r; if (phase !== 'sleep') au.playbackRate = r;
    [...spdEl.children].forEach(c => c.className = c.textContent === (r+'x') ? 'on' : '');
  };
  spdEl.appendChild(b);
});


/* SBR_SLEEP_MUSIC_V1 */ /* SBR_SLEEP_HOST_V2 */
const SLEEP_BASE = (location.protocol === 'file:') ? 'https://addedlife.github.io/pundit-audio/sleep-music/' : '../sleep-music/';
const SLEEP_LEAD = 'silence-4s.mp3';
let sleepMan = null, sleepOrder = [], sleepPos = -1, newsFinished = false;
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
let sleepOn = lsGet('sbr_sleep_on', '1') !== '0';
let sleepList = lsGet('sbr_sleep_list', 'calm');
let hostOn = lsGet('sbr_sleep_host', '1') !== '0';
let sleepPart = 'piece';
const hostSw = document.getElementById('hostSw');
const sleepSw = document.getElementById('sleepSw'), sleepSeg = document.getElementById('sleepSeg'), sleepNow = document.getElementById('sleepNow');
const sleepPrevB = document.getElementById('sleepPrev'), sleepNextB = document.getElementById('sleepNext'), sleepGoB = document.getElementById('sleepGo');
const sleepPre = new Audio(); sleepPre.preload = 'auto'; sleepPre.muted = true;
function inSleep(){ return phase === 'sleep' || phase === 'sleep-done'; }
function sleepTracks(){ return (sleepMan && sleepMan.lists && sleepMan.lists[sleepList]) ? sleepMan.lists[sleepList].tracks : []; }
function sleepLabel(){ return (sleepMan && sleepMan.lists[sleepList]) ? sleepMan.lists[sleepList].label : 'Calm'; }
function loadSleepManifest(){
  return fetch(SLEEP_BASE + 'manifest.json').then(r => { if (!r.ok) throw new Error('manifest'); return r.json(); })
    .then(m => { sleepMan = m; if (!m.lists[sleepList]) sleepList = m.default || 'calm'; renderSleepUI(); return m; })
    .catch(() => null);
}
function renderSleepUI(){
  sleepSw.textContent = sleepOn ? 'On' : 'Off';
  sleepSw.className = 'sw' + (sleepOn ? ' on' : '');
  sleepSw.setAttribute('aria-pressed', sleepOn ? 'true' : 'false');
  hostSw.textContent = hostOn ? 'On' : 'Off';
  hostSw.className = 'sw' + (hostOn ? ' on' : '');
  hostSw.setAttribute('aria-pressed', hostOn ? 'true' : 'false');
  sleepSeg.innerHTML = '';
  if (sleepMan) {
    Object.keys(sleepMan.lists).forEach(k => {
      const b = document.createElement('button');
      const L = sleepMan.lists[k];
      b.textContent = L.label;
      b.className = k === sleepList ? 'on' : '';
      b.title = L.tracks.length + ' pieces, ' + Math.round(L.total_seconds / 60) + ' min';
      b.onclick = () => {
        sleepList = k; lsSet('sbr_sleep_list', k); renderSleepUI();
        if (phase === 'sleep') { userInteracted = true; startSleep(false); }
        else if (phase === 'sleep-done' && sleepOn) { userInteracted = true; startSleep(false); }
      };
      sleepSeg.appendChild(b);
    });
  }
  const insl = inSleep();
  sleepPrevB.disabled = !insl; sleepNextB.disabled = !insl;
  sleepGoB.style.display = insl && phase === 'sleep' ? 'none' : '';
  if (phase === 'sleep') {
    const t = sleepPos >= 0 ? sleepTracks()[sleepOrder[sleepPos]] : null;
    sleepNow.innerHTML = t ? ((sleepPart === 'intro' || sleepPart === 'outro') ? 'Host: ' : '') + '<b>' + t.title + '</b><br>' + t.performer + ' · ' + (sleepPos + 1) + ' of ' + sleepOrder.length + ' · shuffled' : 'Settling in…';
  } else if (phase === 'sleep-done') {
    sleepNow.textContent = sleepOn ? 'The music has finished. Good night.' : 'Sleep music is off.';
  } else if (!sleepMan) {
    sleepNow.textContent = '';
  } else {
    sleepNow.textContent = sleepOn ? 'Plays after the news, shuffled, then stops. ' + sleepTracks().length + ' pieces.' : 'Off: the player stops when the news ends.';
  }
}
function shuffleOrder(n){
  const a = Array.from({length: n}, (_, i) => i);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  const last = parseInt(lsGet('sbr_sleep_first_' + sleepList, '-1'), 10);
  if (n > 1 && a[0] === last) { const j = 1 + Math.floor(Math.random() * (n - 1)); const t = a[0]; a[0] = a[j]; a[j] = t; }
  lsSet('sbr_sleep_first_' + sleepList, String(a[0]));
  return a;
}
function sleepMedia(title, artist){
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title: title, artist: artist, album: 'SBR Sleep Music · ' + sleepLabel() });
  navigator.mediaSession.setActionHandler('play', () => startFromGesture());
  navigator.mediaSession.setActionHandler('pause', () => au.pause());
  navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.click());
  navigator.mediaSession.setActionHandler('nexttrack', () => nextBtn.click());
}
function startSleep(withLead){
  const tl = sleepTracks();
  if (!sleepMan || !tl.length) return false;
  sleepOrder = shuffleOrder(tl.length);
  loadSeq++;
  phase = 'sleep';
  [...listEl.children].forEach(c => c.classList.remove('on'));
  playSleepAt(withLead ? -1 : 0);
  return true;
}
function playSleepAt(pos, part){
  const tl = sleepTracks();
  loadSeq++;
  if (pos >= sleepOrder.length) { sleepFinish(); return; }
  phase = 'sleep';
  sleepPos = pos;
  au.defaultPlaybackRate = 1;
  if (pos < 0) {
    sleepPart = 'piece';
    au.src = SLEEP_BASE + SLEEP_LEAD;
    nsec.textContent = 'Sleep music · ' + sleepLabel();
    ntit.textContent = 'Settling in…';
    durEl.textContent = '0:04';
    sleepMedia('Sleep music', sleepLabel());
  } else {
    const t = tl[sleepOrder[pos]];
    if (part === 'outro' && !(hostOn && t.outro)) { playSleepAt(pos + 1); return; }  /* SBR_SLEEP_OUTRO_V1 */
    if (part === 'outro') {
      sleepPart = 'outro';
      au.src = SLEEP_BASE + t.outro;
      nsec.textContent = 'Sleep music · ' + sleepLabel() + ' · ' + (pos + 1) + ' of ' + sleepOrder.length + ' · host';
      ntit.textContent = t.title;
      durEl.textContent = fmt(t.outro_duration || 0);
      sleepMedia('That was: ' + t.title, 'SBR Classical');
      if (pos + 1 < sleepOrder.length) { const n = tl[sleepOrder[pos + 1]]; sleepPre.src = SLEEP_BASE + ((hostOn && n.intro) ? n.intro : n.file); }
    } else if (hostOn && t.intro && part !== 'piece') {
      sleepPart = 'intro';
      au.src = SLEEP_BASE + t.intro;
      nsec.textContent = 'Sleep music · ' + sleepLabel() + ' · ' + (pos + 1) + ' of ' + sleepOrder.length + ' · introduction';
      ntit.textContent = t.title;
      durEl.textContent = fmt(t.intro_duration || 0);
      sleepMedia('Introducing: ' + t.title, 'SBR Classical');
      sleepPre.src = SLEEP_BASE + t.file;
    } else {
      sleepPart = 'piece';
      au.src = SLEEP_BASE + t.file;
      nsec.textContent = 'Sleep music · ' + sleepLabel() + ' · ' + (pos + 1) + ' of ' + sleepOrder.length;
      ntit.textContent = t.title;
      durEl.textContent = fmt(t.duration);
      sleepMedia(t.title, t.performer);
      if (hostOn && t.outro) { sleepPre.src = SLEEP_BASE + t.outro; }
      else if (pos + 1 < sleepOrder.length) { const n = tl[sleepOrder[pos + 1]]; sleepPre.src = SLEEP_BASE + ((hostOn && n.intro) ? n.intro : n.file); }
    }
  }
  au.playbackRate = 1;
  curEl.textContent = '0:00'; seek.value = 0;
  renderSleepUI();
  tryPlay();
}
function sleepFinish(){
  phase = 'sleep-done'; playing = false;
  playBtn.innerHTML = '&#9654; Play';
  nsec.textContent = 'Sleep music · finished';
  ntit.textContent = 'Good night.';
  sleepMedia('Good night', 'SBR News');
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  renderSleepUI();
}
function newsEnded(){
  newsFinished = true; playing = false;
  playBtn.innerHTML = '&#9654; Play';
  if (!sleepOn) { renderSleepUI(); return; }
  if (sleepMan) { startSleep(true); return; }
  loadSleepManifest().then(m => { if (m && sleepOn && newsFinished && !inSleep()) startSleep(true); });
}
function sleepPrev(){
  userInteracted = true;
  if (phase === 'sleep-done') { phase = 'sleep'; playSleepAt(Math.max(sleepOrder.length - 1, 0)); return; }
  if (sleepPart === 'piece' && au.currentTime > 4 && sleepPos >= 0) { au.currentTime = 0; tryPlay(); return; }
  if (sleepPart === 'intro' && sleepPos > 0) { playSleepAt(sleepPos - 1); return; }
  if (sleepPart === 'outro') { playSleepAt(sleepPos); return; }
  playSleepAt(Math.max(sleepPos - 1, 0));
}
function sleepNext(){
  userInteracted = true;
  if (phase === 'sleep-done') return;
  playSleepAt(sleepPos + 1);
}
sleepPrevB.onclick = () => sleepPrev();
hostSw.onclick = () => { hostOn = !hostOn; lsSet('sbr_sleep_host', hostOn ? '1' : '0'); if (!hostOn && phase === 'sleep' && sleepPart === 'intro') playSleepAt(sleepPos, 'piece'); else if (!hostOn && phase === 'sleep' && sleepPart === 'outro') sleepNext(); renderSleepUI(); };
sleepNextB.onclick = () => sleepNext();
sleepGoB.onclick = () => {
  userInteracted = true;
  if (!sleepOn) { sleepOn = true; lsSet('sbr_sleep_on', '1'); }
  const go = () => { newsFinished = true; startSleep(false); };
  if (sleepMan) go(); else loadSleepManifest().then(m => { if (m) go(); });
};
sleepSw.onclick = () => {
  userInteracted = true;
  sleepOn = !sleepOn; lsSet('sbr_sleep_on', sleepOn ? '1' : '0');
  if (!sleepOn && phase === 'sleep') { au.pause(); sleepFinish(); }
  else if (sleepOn && (phase === 'sleep-done' || (newsFinished && !inSleep()))) { if (sleepMan) startSleep(false); }
  renderSleepUI();
};
loadSleepManifest();
renderSleepUI();

if (liveClock) {
  prewarmIntro();
  setInterval(() => { if (!playing && phase === 'intro-clock') prewarmIntro(); }, 15000);
}
load(idx, wantAuto);
