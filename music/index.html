<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SBR Music</title>
<style>
:root{--bg:#EDECE8;--card:#F4F3EF;--ink:#231F20;--mut:#5c5755;--line:#d5d1c8}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#21201e;--ink:#f2efe9;--mut:#a7a29b;--line:#35332f}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
</style>
</head>
<body>
<div id="app"></div>
<script src="music-panel.js"></script>
<script>
SBRMusic.mount(document.getElementById('app'), { embedded: false, base: '../sleep-music/', info: 'music-info.json' }).then(function(){
  function go(){ var h = location.hash.replace(/^#(music\/)?/, ''); if (h) SBRMusic.show(decodeURIComponent(h)); }
  window.addEventListener('hashchange', go); go();
}).catch(function(){ document.getElementById('app').textContent = 'The music list could not be loaded. Please try again.'; });
</script>
</body>
</html>
