function openBlk(i) {

  stopGlide(); planGeometry(b); layout();
  cpath = papercut(i + 3);
  hi.classList.remove('ok'); hi.onload = () => { if (!vst) hi.classList.add('ok'); }; hi.src = b.img;
  if (hi.complete && hi.naturalWidth) hi.classList.add('ok');

  vec.style.display = 'none'; vec.style.transform = 'none'; vst = null; vecFor = -1; vec.innerHTML = '';
  cardLinks.forEach(a => a.remove());

  const y1 = Math.max(margin(), (innerHeight - CH * startS) / 2);

  vec.style.display = 'none'; lo.style.visibility = 'visible'; hi.classList.add('ok');
  const src = el.getBoundingClientRect();
  const s1 = src.width / bw;

  animate(src2.left - padX * s1, src2.top - padT * s1, s1, DUR - 40, false, () => {

/* ---------- gestures on the open clipping ---------- */
let lastCardTap = 0, lastCardX = 0, lastCardY = 0;
const fingers = new Map();

function onCard(el) { return el && (el === card || card.contains(el)); }

function touchList(e) {

function onTouchStart(e) {

  stopGlide();
  if (busy) return;

    startX = panLastX = t0.clientX; startY = panLastY = t0.clientY; startT = performance.now();

  }

    const p = pts();

    pinchStartDist = dist(p[0], p[1]) || 1;

function onTouchMove(e) {

    pinching = true; gesturePinch = true; moved = true;
    const d = dist(p[0], p[1]) || 1;
    const midX = (p[0].x + p[1].x) / 2, midY = (p[0].y + p[1].y) / 2;
    const newS = rubberScale(pinchStartS * (d / pinchStartDist));

stage.addEventListener('touchstart', onTouchStart, { passive: false });
stage.addEventListener('touchmove', onTouchMove, { passive: false });
stage.addEventListener('touchend', onTouchEnd, { passive: false });
stage.addEventListener('touchcancel', onTouchEnd, { passive: false });

// Keep the page itself from pinch-zooming or scrolling while a clipping is open.
function lockPage(e) { if (cur >= 0) e.preventDefault(); }

document.addEventListener('gestureend', lockPage, { passive: false });

/* mouse / trackpad */
let mouseDown = false;
stage.addEventListener('mousedown', e => {
  if (cur < 0 || busy || e.button !== 0) return;

  mouseDown = true; startOnCard = onCard(e.target);

  if (cur < 0 || busy) return;

  if (e.ctrlKey || e.metaKey) {

    setScaleAt(s * factor, e.clientX, e.clientY, false);

window.addEventListener('load', () => setTimeout(() => D.blocks.forEach(b => { const im = new Image(); im.src = b.img; }), 600));

/* ---------- edition navigation (from ../editions.json, so older pages gain 'next' as new briefs publish) ---------- */
(function () {
  const prevEl = document.getElementById('edprev'), nextEl = document.getElementById('ednext');
  if (!prevEl) return;
  const SLUG = D.slug || (location.pathname.split('/').filter(Boolean).slice(-2)[0] || '');
  function place() {
    if (D.w > 500) {                          // top margin of the sheet, right of LISTEN ALL and left of the right edge
      prevEl.style.left = (178 / D.w * 100) + '%';
      prevEl.style.width = (260 / D.w * 100) + '%';
      prevEl.style.justifyContent = 'flex-start';
      nextEl.style.left = (500 / D.w * 100) + '%';
      nextEl.style.width = (272 / D.w * 100) + '%';
      nextEl.style.justifyContent = 'flex-end';
      prevEl.style.top = nextEl.style.top = (24 / D.h * 100) + '%';
    } else {                                  // narrow What's News column: a slim strip under the top edge
      prevEl.style.left = '2%'; prevEl.style.width = '46%'; prevEl.style.justifyContent = 'flex-start';
      nextEl.style.left = '52%'; nextEl.style.width = '46%'; nextEl.style.justifyContent = 'flex-end';
      prevEl.style.top = nextEl.style.top = '18px';
    }
  }
  function link(e, dir) {
    const href = '../' + (e.front || (e.slug + '/front.html'));
    const label = dir < 0 ? '‹ ' + e.label : e.label + ' ›';
    return '<a href="' + href + '">' + label + '</a>';
  }
  place();
  fetch('../editions.json').then(r => r.ok ? r.json() : Promise.reject()).then(data => {
    const list = (data && data.editions) || [];
    const i = list.findIndex(e => e.slug === SLUG);
    if (i < 0) return;
    const prev = list.slice(Math.max(0, i - 2), i);
    const next = list.slice(i + 1, i + 3);
    if (prev.length) { prevEl.innerHTML = prev.map(e => link(e, -1)).join('<span class="dot"> · </span>'); prevEl.hidden = false; }
    if (next.length) { nextEl.innerHTML = next.map(e => link(e, 1)).join('<span class="dot"> · </span>'); nextEl.hidden = false; }

})();
