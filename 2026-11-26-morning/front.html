    vx *= decay; vy *= decay;
    const b = bounds();
    const spring = (pos, vel, lo, hi) => {
      let target = null;

  if (withAnim) { x = nx0; y = ny0; s = newS; clampPan(); animate(x, y, s, 260, true); return; }

let animId = 0;

window.__pan = () => ({ x, y, s, gliding, vx, vy, bounds: bounds() });

function openBlk(i) {
  if (busy || cur >= 0) return; busy = true; cur = i;
  const b = D.blocks[i], el = blkEls[i];
  savedY = window.scrollY || 0;
  curP = PG[b.pg || 0];
  stopGlide(); planGeometry(b); sb = startS; vst = null; layout();
  cpath = papercut(i + 3);
  hi.classList.remove('ok'); hi.onload = () => { if (!vst) hi.classList.add('ok'); }; hi.src = b.img;
  if (hi.complete && hi.naturalWidth) hi.classList.add('ok');
  lo.style.backgroundImage = 'url(' + curP.img + ')'; lo.style.visibility = 'visible';
  vec.style.display = 'none'; vec.style.transform = 'none'; vst = null; vecFor = -1; vec.innerHTML = ''; vecLive = false; clearTimeout(unveilT);
  cardLinks.forEach(a => a.remove());
  cardLinks = b.links.map(l => cl.appendChild(mkLink(l, bw, bh, 'cz')));
  document.body.style.top = `-${savedY}px`;
  root.classList.add('zoomed'); root.classList.remove('settled', 'closing');
  loadVec(i);
  const x1 = startS * 0 + ((startS * CW >= innerWidth - 2 * margin()) ? margin() : (innerWidth - CW * startS) / 2);
  const y1 = Math.max(margin(), (innerHeight - CH * startS) / 2);
  const src = el.getBoundingClientRect();
  s = src.width / bw; x = src.left - padX * s; y = src.top - padT * s;
  el.classList.add('src');
  apply();
  requestAnimationFrame(() => animate(x1, y1, startS, DUR, false, () => {
    clampPan(); apply();
    busy = false; root.classList.add('settled'); settle(); placeX(); mountVec();
  }));
}
function closeBlk() {
  if (busy || cur < 0) return; busy = true;
  const el = blkEls[cur];
  stopGlide(); animId++;
  root.classList.remove('settled'); root.classList.add('closing');
  vec.style.display = 'none'; lo.style.visibility = 'visible'; hi.classList.add('ok');
  const src = el.getBoundingClientRect();
  const s1 = src.width / bw;
  root.classList.remove('zoomed');
  document.body.style.top = '';
  window.scrollTo(0, savedY);
  const src2 = el.getBoundingClientRect();
  animate(src2.left - padX * s1, src2.top - padT * s1, s1, DUR - 40, false, () => {
    el.classList.remove('src'); root.classList.remove('closing');
    cur = -1; busy = false; moved = pinching = gesturePinch = false;
    card.dataset.scale = ''; vst = null; vecFor = -1; vec.innerHTML = ''; vecLive = false; clearTimeout(unveilT);
  });
}

/* ---------- gestures on the open clipping ---------- */
let lastCardTap = 0, lastCardX = 0, lastCardY = 0;
const fingers = new Map();
let pinchStartDist = 0, pinchStartS = 1, pinchMidX = 0, pinchMidY = 0;
let panLastX = 0, panLastY = 0, startX = 0, startY = 0, startT = 0, startOnCard = false;

function onCard(el) { return el && (el === card || card.contains(el)); }
function dist(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return Math.hypot(dx, dy); }
function pts() { return [...fingers.values()]; }

function zoomAround(newS, fx, fy, anim) { setScaleAt(newS, fx, fy, anim); }

function maybeOutsideClose() {
  // A single tap on the dim area closes. A finger-up that ends a pinch or drag
  // is not a tap (see wasMoved / wasPinch in the touch/mouse handlers).
  closeBlk(); return true;
}
function maybeCardDouble(fx, fy) {
  const now = performance.now();
  if (now - lastCardTap < TAP_MS && Math.hypot(fx - lastCardX, fy - lastCardY) < 40) {
    lastCardTap = 0;
    zoomAround((s > startS * 1.4 ? startS : Math.min(maxS, startS * DBL_Z)), fx, fy, true);
    return true;
  }
  lastCardTap = now; lastCardX = fx; lastCardY = fy; return false;
}
function fireLink(a) {
  if (!a || !a.href) return;
  // Don't trip the drag-suppression on the synthetic click; block only the trailing native one.
  a.click();
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 400);
}

function touchList(e) {
  // Trust e.touches (current set). Empty touchEnd payloads otherwise leave stale fingers.
  fingers.clear();
  const live = e.touches || [];
  for (const t of live) fingers.set(t.identifier, { x: t.clientX, y: t.clientY, id: t.identifier });
}

function onTouchStart(e) {
  if (cur < 0) return;
  e.preventDefault();
  stopGlide();
  if (busy) return;
  touchList(e);
  const t0 = e.changedTouches[0];
  if (fingers.size === 1) {
    startX = panLastX = t0.clientX; startY = panLastY = t0.clientY; startT = performance.now();
    startOnCard = onCard(e.target) && e.target !== xb && !xb.contains(e.target);
    moved = pinching = gesturePinch = false;
    samples = [{ t: startT, x, y }];
  }
  if (fingers.size >= 2) {
    const p = pts();
    pinching = true; gesturePinch = true; moved = true;
    pinchStartDist = dist(p[0], p[1]) || 1;
    pinchStartS = s;
    pinchMidX = (p[0].x + p[1].x) / 2; pinchMidY = (p[0].y + p[1].y) / 2;
  }
}
function onTouchMove(e) {
  if (cur < 0) return;
  e.preventDefault();
  if (busy) return;
  touchList(e);
  if (fingers.size >= 2) {
    const p = pts();
    pinching = true; gesturePinch = true; moved = true;
    const d = dist(p[0], p[1]) || 1;
    const midX = (p[0].x + p[1].x) / 2, midY = (p[0].y + p[1].y) / 2;
    const newS = rubberScale(pinchStartS * (d / pinchStartDist));
    const k = newS / s;
    x = midX - (midX - x) * k; y = midY - (midY - y) * k; s = newS;

    pinchMidX = (p[0].x + p[1].x) / 2; pinchMidY = (p[0].y + p[1].y) / 2;

    const t = pts()[0];

  if (!wasOnCard) { maybeOutsideClose(); return; }
  if (maybeCardDouble(sx, sy)) return;
  const top = document.elementFromPoint(sx, sy);

stage.addEventListener('touchstart', onTouchStart, { passive: false });
stage.addEventListener('touchmove', onTouchMove, { passive: false });
stage.addEventListener('touchend', onTouchEnd, { passive: false });
stage.addEventListener('touchcancel', onTouchEnd, { passive: false });

// Keep the page itself from pinch-zooming or scrolling while a clipping is open.
function lockPage(e) { if (cur >= 0) e.preventDefault(); }
document.addEventListener('touchmove', lockPage, { passive: false });
document.addEventListener('gesturestart', lockPage, { passive: false });
document.addEventListener('gesturechange', lockPage, { passive: false });
document.addEventListener('gestureend', lockPage, { passive: false });

/* mouse / trackpad */
let mouseDown = false, wheelTimer = 0;
stage.addEventListener('mousedown', e => {
  if (cur < 0 || busy || e.button !== 0) return;
  if (e.target === xb || xb.contains(e.target)) return;
  stopGlide();
  mouseDown = true; startOnCard = onCard(e.target);
  startX = panLastX = e.clientX; startY = panLastY = e.clientY; startT = performance.now();
  moved = false; samples = [{ t: startT, x, y }];
});
window.addEventListener('mousemove', e => {
  if (!mouseDown || cur < 0) return;
  if (Math.hypot(e.clientX - startX, e.clientY - startY) > TAP_PX) moved = true;
  if (moved && startOnCard) {
    x += e.clientX - panLastX; y += e.clientY - panLastY;
    panLastX = e.clientX; panLastY = e.clientY;
    card.classList.add('panning');
    rubberXY(); noteSample(); apply();
  }
});
window.addEventListener('mouseup', e => {
  if (!mouseDown) return;
  mouseDown = false; card.classList.remove('panning');
  if (cur < 0 || busy) return;
  const tap = !moved && (performance.now() - startT < 500);
  if (!tap) {
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 400);
    const v = sampleVelocity();
    startGlide(startOnCard ? v.vx : 0, startOnCard ? v.vy : 0);
    return;
  }
  if (!startOnCard) { maybeOutsideClose(); return; }
  if (maybeCardDouble(e.clientX, e.clientY)) return;
  const top = document.elementFromPoint(e.clientX, e.clientY);
  const a = top && top.closest && top.closest('a.lk.cz');
  if (a) fireLink(a);
});
stage.addEventListener('wheel', e => {
  if (cur < 0 || busy) return;
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {
    const factor = Math.exp(-e.deltaY * 0.01);
    setScaleAt(s * factor, e.clientX, e.clientY, false);
    noteSample();
    clearTimeout(wheelTimer); wheelTimer = setTimeout(() => startGlide(0, 0), 160);
  } else {
    x -= e.deltaX; y -= e.deltaY;
    rubberXY(); noteSample(); apply();
  }
}, { passive: false });

xb.addEventListener('click', e => { e.stopPropagation(); e.preventDefault(); closeBlk(); });
xb.addEventListener('touchend', e => { e.stopPropagation(); e.preventDefault(); if (!busy) closeBlk(); }, { passive: false });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBlk(); });
window.addEventListener('resize', () => {
  if (cur < 0 || busy) return;
  const z = s / startS;
  planGeometry(D.blocks[cur]);
  s = Math.max(minS, Math.min(maxS, startS * z));
  clampPan(); apply(); commit();
});
window.addEventListener('load', () => setTimeout(() => D.blocks.filter(b => !b.pg).forEach(b => { const im = new Image(); im.src = b.img; }), 600));

/* ---------- edition navigation (from ../editions.json, so older pages gain 'next' as new briefs publish) ---------- */
(function () {
  const prevEl = document.getElementById('edprev'), nextEl = document.getElementById('ednext');
  if (!prevEl) return;
  const SLUG = D.slug || (location.pathname.split('/').filter(Boolean).slice(-2)[0] || '');
  function place() {
    if (D.nav) {                              // explicit placement (pdf units on page 1), e.g. the WSJ front page
      prevEl.style.left = (D.nav.prev[0] / D.w * 100) + '%'; prevEl.style.width = (D.nav.prev[1] / D.w * 100) + '%'; prevEl.style.justifyContent = 'flex-start';
      nextEl.style.left = (D.nav.next[0] / D.w * 100) + '%'; nextEl.style.width = (D.nav.next[1] / D.w * 100) + '%'; nextEl.style.justifyContent = 'flex-end';
      prevEl.style.top = nextEl.style.top = (D.nav.top / D.h * 100) + '%';
    } else if (D.w > 500) {                   // top margin of the sheet, right of LISTEN ALL and left of the right edge
      prevEl.style.left = (178 / D.w * 100) + '%';
      prevEl.style.width = (260 / D.w * 100) + '%';
      prevEl.style.justifyContent = 'flex-start';
      nextEl.style.left = (500 / D.w * 100) + '%';
      nextEl.style.width = (272 / D.w * 100) + '%';
      nextEl.style.justifyContent = 'flex-end';
      prevEl.style.top = nextEl.style.top = (24 / D.h * 100) + '%';
    } else {                                  // narrow What's News column: a slim strip under the top edge
      prevEl.style.left = '2%'; prevEl.style.width = '46%'; prevEl.style.justifyContent = 'flex-start';
      nextEl.style.left = '52%'; nextEl.style.width = '46%'; nextEl.style.justifyContent = 'flex-end';
      prevEl.style.top = nextEl.style.top = '18px';
    }
  }
  function link(e, dir) {
    const href = '../' + (e.front || (e.slug + '/front.html'));
    const label = dir < 0 ? '‹ ' + e.label : e.label + ' ›';
    return '<a href="' + href + '">' + label + '</a>';
  }
  place();
  fetch('../editions.json').then(r => r.ok ? r.json() : Promise.reject()).then(data => {
    const list = (data && data.editions) || [];
    const i = list.findIndex(e => e.slug === SLUG);
    if (i < 0) return;
    const prev = list.slice(Math.max(0, i - 2), i);
    const next = list.slice(i + 1, i + 3);
    if (prev.length) { prevEl.innerHTML = prev.map(e => link(e, -1)).join('<span class="dot"> · </span>'); prevEl.hidden = false; }
    if (next.length) { nextEl.innerHTML = next.map(e => link(e, 1)).join('<span class="dot"> · </span>'); nextEl.hidden = false; }
  }).catch(() => {});
})();

</script>
